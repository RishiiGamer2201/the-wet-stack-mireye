[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wetstack-mireye-api"
version = "0.1.0"
description = "The Wet Stack - Mireye: data-center construction & EPC intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pint>=0.23",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Live-mode services. The application runs fully without them.
live = ["neo4j>=5.19", "psycopg[binary]>=3.1"]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "ruff>=0.4"]

# Declared explicitly: the runtime writes `var/` (SQLite + uploads) next to `app/`,
# and setuptools' flat-layout auto-discovery refuses to build once it sees both.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() default is idiomatic.
# E501: line length is enforced by the formatter, not the linter.
# UP042: `str, Enum` is deliberate — it keeps enum values JSON-serialisable for Pydantic.
ignore = ["B008", "E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
