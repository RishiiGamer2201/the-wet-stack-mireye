# Render Blueprint for the backend API.
#
# Render only auto-detects a Blueprint named `render.yaml` at the repository
# root, which is why this file lives here rather than under `infra/`.
#
# Every service credential is optional. With none set, the deployed API runs the
# same deterministic demo mode as a local checkout: mock Mireye, in-memory impact
# graph, local hybrid retrieval, SQLite storage and template explanations.
#
# EPHEMERAL FILESYSTEM: Render gives this service a fresh disk on every deploy
# and on every restart. The SQLite database and uploaded PDFs live on it, so both
# are lost each time and the demo project is re-seeded automatically on startup.
# That is acceptable for a demo and is NOT production persistence — see
# docs/deployment.md before pointing this at anything real.

services:
  - type: web
    name: wetstack-mireye-api
    # Docker, not the native Python runtime: OCR needs the `tesseract` binary,
    # which apt installs and pip cannot. See apps/api/Dockerfile.
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    # `starter` keeps the service warm. `free` also works and costs nothing, but
    # it spins down after ~15 minutes idle: the next request takes ~50 s and the
    # ephemeral disk is wiped, so the demo re-seeds. Reliability vs cost.
    plan: starter
    region: oregon
    autoDeploy: false
    # Build and start commands live in the Dockerfile, including the single-worker
    # constraint the in-process impact graph depends on.
    healthCheckPath: /api/health
    envVars:
      # Python version is pinned by the Dockerfile's base image.
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Render terminates TLS at its proxy. Set as an env var rather than a
      # `--forwarded-allow-ips '*'` flag so no shell quoting can mangle it.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Writable path on the ephemeral disk for SQLite + uploads.
      - key: DATA_DIR
        value: /tmp/wetstack
      # OCR for scanned PDFs. The image ships tesseract, so this is on by
      # default; set to false to make uploads faster and refuse scans instead.
      - key: OCR_ENABLED
        value: "true"
      # ~1-3 s per page. Past this the remaining scanned pages are reported as
      # unread rather than holding the upload request open for minutes.
      - key: OCR_MAX_PAGES
        value: "30"
      # Demo data is seeded only when the store is empty. Set to false for any
      # deployment with a real DATABASE_URL.
      - key: SEED_ON_STARTUP
        value: "true"
      # REQUIRED. Comma-separated exact frontend origins — no wildcard.
      # e.g. https://wetstack-mireye.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # --- everything below is optional; unset means the local adapter ---
      - key: MIREYE_BASE_URL
        sync: false
      - key: MIREYE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
